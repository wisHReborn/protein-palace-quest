<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="crystalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#C084FC" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="facet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </linearGradient>
    <linearGradient id="facet2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="40" fill="#090D16"/>
  <circle cx="100" cy="100" r="85" fill="url(#crystalGlow)"/>

  <!-- Magical Crystal Structure -->
  <g transform="translate(100, 100)">
    <!-- Back Glow Facets -->
    <polygon points="0,-65 45,-20 0,65 -45,-20" fill="url(#facet1)" opacity="0.9"/>
    <polygon points="0,-65 45,-20 30,0 0,-15" fill="#F472B6" opacity="0.9"/>
    <polygon points="0,-65 -45,-20 -30,0 0,-15" fill="#38BDF8" opacity="0.8"/>
    <polygon points="45,-20 0,65 0,0 30,0" fill="url(#facet2)"/>
    <polygon points="-45,-20 0,65 0,0 -30,0" fill="#A855F7"/>

    <!-- Inner Peptide Sparkles -->
    <circle cx="-15" cy="-25" r="4" fill="#FFF" opacity="0.9"/>
    <circle cx="20" cy="15" r="3" fill="#FFF" opacity="0.8"/>
    <circle cx="0" cy="-45" r="5" fill="#FDE047" opacity="0.9"/>
  </g>

  <!-- Floating Sparkles -->
  <text x="35" y="50" font-size="16" fill="#FFF" opacity="0.8">✨</text>
  <text x="145" y="160" font-size="18" fill="#FFF" opacity="0.8">🧬</text>
  <text x="150" y="55" font-size="14" fill="#FFF" opacity="0.8">💧</text>
</svg>
