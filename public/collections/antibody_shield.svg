<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="shieldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#E11D48" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="40" fill="#090D16"/>
  <circle cx="100" cy="100" r="85" fill="url(#shieldGlow)"/>

  <!-- Golden Antibody Shield -->
  <g transform="translate(100, 100)">
    <!-- Shield Base Shape -->
    <path d="M 0 -55 Q 45 -45 50 -10 Q 50 40 0 65 Q -50 40 -50 -10 Q -45 -45 0 -55 Z" fill="url(#shieldGold)" stroke="#FFF" stroke-width="3"/>

    <!-- Y-Shaped Antibody Emblem -->
    <path d="M -22 -30 L 0 -5 L 22 -30 M 0 -5 L 0 35" fill="none" stroke="#F43F5E" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -22 -30 L 0 -5 L 22 -30 M 0 -5 L 0 35" fill="none" stroke="#FFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Gem Jewels on Y arms -->
    <circle cx="-22" cy="-30" r="6" fill="#38BDF8"/>
    <circle cx="22" cy="-30" r="6" fill="#38BDF8"/>
    <circle cx="0" cy="35" r="6" fill="#10B981"/>
  </g>

  <!-- Floating Elements -->
  <text x="35" y="50" font-size="16" fill="#FFF" opacity="0.9">💗</text>
  <text x="145" y="160" font-size="18" fill="#FFF" opacity="0.8">🛡️</text>
  <text x="150" y="55" font-size="14" fill="#FFF" opacity="0.9">✨</text>
</svg>
