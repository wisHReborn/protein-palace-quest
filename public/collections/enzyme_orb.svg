<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="40" fill="#090D16"/>
  <circle cx="100" cy="100" r="85" fill="url(#orbGlow)"/>

  <!-- Catalytic Enzyme Orb Spheres & Active Site Notch -->
  <g transform="translate(100, 100)">
    <!-- Outer Magic Ring -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-dasharray="8 4"/>

    <!-- Orb Core -->
    <circle cx="0" cy="0" r="42" fill="url(#orbCore)" stroke="#FFF" stroke-width="2"/>

    <!-- Lock & Key Active Site Contour -->
    <path d="M -20 -15 L 0 -35 L 20 -15 L 15 15 L -15 15 Z" fill="#FDE047" opacity="0.9"/>
    <circle cx="0" cy="0" r="10" fill="#0F172A"/>
    <path d="M -5 -5 L 5 5 M 5 -5 L -5 5" stroke="#2DD4BF" stroke-width="2"/>
  </g>

  <!-- Floating Magic Particles -->
  <text x="35" y="50" font-size="16" fill="#FFF" opacity="0.8">🧪</text>
  <text x="145" y="160" font-size="18" fill="#FFF" opacity="0.8">🔑</text>
  <text x="150" y="55" font-size="14" fill="#FFF" opacity="0.9">⚡</text>
</svg>
