<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="ribbonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#E879F9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="40" fill="#090D16"/>
  <circle cx="100" cy="100" r="85" fill="url(#ribbonGlow)"/>

  <!-- Crown Base & Alpha Helix Waves -->
  <g transform="translate(100, 105)">
    <!-- Helix Back Waves -->
    <path d="M -60 20 C -40 -30 -20 50 0 -20 C 20 -50 40 40 60 -10" fill="none" stroke="#C084FC" stroke-width="8" stroke-linecap="round" opacity="0.6"/>

    <!-- Gold Alpha Crown Ribbon -->
    <path d="M -65 10 Q -40 -60 -10 10 Q 0 -70 30 -10 Q 50 -60 65 10 Q 40 45 0 35 Q -40 45 -65 10 Z" fill="url(#goldRibbon)" stroke="#FFF" stroke-width="2"/>

    <!-- Jewels -->
    <circle cx="0" cy="-40" r="7" fill="#EC4899"/>
    <circle cx="-40" cy="-30" r="5" fill="#38BDF8"/>
    <circle cx="40" cy="-30" r="5" fill="#38BDF8"/>
    <circle cx="0" cy="10" r="6" fill="#F43F5E"/>
  </g>

  <!-- Floating Elements -->
  <text x="35" y="55" font-size="18" fill="#FFF" opacity="0.9">👑</text>
  <text x="145" y="155" font-size="18" fill="#FFF" opacity="0.8">🎀</text>
  <text x="140" y="50" font-size="14" fill="#FFF" opacity="0.8">✨</text>
</svg>
